name: Update README cards

on:
  schedule:
    - cron: '0 3 * * *' # Runs once daily at midnight
  push:
    paths:
      - '.github/workflows/streak-stats.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&custom_title=Mis%20Stats%21&show=reviews%2Cprs_merged%2Cprs_commented%2Cprs_reviewed&hide=issues,contribs,stars&show_icons=true&include_all_commits=true&theme=transparent&hide_border=true&ring_color=fff&icon_color=fff&title_color=7AE0F5&text_color=91EDA1&locale=en&card_width=400px
          path: profile/stats.svg
          token: ${{ secrets.README_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&locale=es&hide_title=false&card_width=320&langs_count=5&theme=transparent&hide_border=true&layout=donut&custom_title=Mis%20lenguajes%20mas%20usados&hide=CMake,HTML&title_color=7AE0F5&text_color=91EDA1&card_width=340px
          path: profile/top-langs.svg
          token: ${{ secrets.README_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
